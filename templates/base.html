<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ArmonIA Vial{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="ArmonIA Vial" class="logo">
                <span class="brand-name">ArmonIA Vial</span>
            </div>
            <button class="nav-toggle" id="navToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="{{ url_for('index') }}" class="nav-link"><i class="fas fa-home"></i> Inicio</a></li>
                <li><a href="{{ url_for('ambiente') }}" class="nav-link"><i class="fas fa-leaf"></i> Ambiente</a></li>
                <li><a href="{{ url_for('cultura') }}" class="nav-link"><i class="fas fa-theater-masks"></i> Cultura</a></li>
                <li><a href="{{ url_for('educacion') }}" class="nav-link"><i class="fas fa-graduation-cap"></i> Educación</a></li>
                <li><a href="{{ url_for('mapa') }}" class="nav-link"><i class="fas fa-map-marked-alt"></i> Mapa</a></li>
                <li><a href="{{ url_for('comunidad') }}" class="nav-link"><i class="fas fa-users"></i> Comunidad</a></li>
                <li><a href="{{ url_for('asistente') }}" class="nav-link"><i class="fas fa-robot"></i> Asistente</a></li>
            </ul>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>Mover con respeto, vivir en armonía. © ArmonIA Vial 2025</p>
            <p class="footer-subtitle">Urabá, Antioquia - Colombia 🇨🇴</p>
        </div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
